services:
  db:
    image: postgres:17
    container_name: blog_db
    restart: unless-stopped
    volumes:
      - blog_db_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 5s
      timeout: 3s
      retries: 3

  django:
    image: ghcr.io/yulenka26/django_project:latest
    container_name: blog
    command: make serv
    restart: unless-stopped
    volumes:
      - ./media:/app/src/project/media/
      - ./static:/app/static_files
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 5s
      timeout: 3s
      retries: 3

  celery:
    image: ghcr.io/yulenka26/django_project:latest
    container_name: blog_celery
    command: make celery_run_docker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: unless-stopped
    volumes:
      - blog_redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3


  caddy:
    image: caddy:latest
    container_name: blog_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./static:/static
      - ./media:/media
      - caddy_data:/data
      - caddy_config:/config


volumes:
  blog_db_data:
  blog_redis_data:
  caddy_data:
  caddy_config:
