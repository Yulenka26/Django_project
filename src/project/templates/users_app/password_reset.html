{% extends "base.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-body">
                <h2 class="mb-4 text-center">Введите ваш Email для сброса пароля</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}

                    <div class="mb-3">
                        {{ form.email.label_tag }}
                        {{ form.email }}
                        {{ form.email.errors }}
                    </div>

                    <button type="submit" class="btn btn-primary">Отправить письмо на почту</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
