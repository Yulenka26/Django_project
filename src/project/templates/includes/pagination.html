
{% block content %}
    <div class="input-group mb-3">
        {% if page_obj.has_previous %}
            <a href="?page={{ page_obj.previous_page_number }}" class="btn btn-outline-info">Назад</a>
        {% endif %}
    </div>
    <div class="input-group mb-3">
        Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}
    </div>
    <div class="input-group mb-3">
        {% if page_obj.has_next %}
            <a href="?page={{ page_obj.next_page_number }}" class="btn btn-outline-info">Вперед</a>
        {% endif %}
    </div>
{% endblock %}
