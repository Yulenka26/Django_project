{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <img src="/media/logo1.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
        <a href="{% url "blog:index" %}" class="navbar-brand">Главная страница</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a href="{% url "blog:categories_list" %}" class="nav-link">Категории</a>
            </li>
            <li class="nav-item">
                <a href="{% url "blog:post_list" %}" class="nav-link">Статьи</a>
            </li>
        </ul>

        <!-- Кнопка поиска по статьям -->
        <form class="d-flex" method="get" action="{% url 'blog:post_list' %}"> <!-- где ищем статьи blog:post_list -->
            <input class="form-control me-2" name="text" type="search" placeholder="Поиск" aria-label="Поиск"> <!--сам запрос пользователя text -->
            <button class="btn btn-outline-info" type="submit">Найти</button>
        </form>

        <!-- Переключатель темы -->
        <ul class="navbar-nav">
            <li class="nav-item mt-2 mx-2 text-white">
                <div class="d-flex align-items-center">
                    <span class="me-3">Светлая тема</span>
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="theme-switch">
                    </div>
                    <span class="ms-3">Тёмная тема</span>
                </div>
            </li>
        </ul>

        <!-- Вход/Выход/Регистрация -->
        {% if user.is_authenticated  %}
        <form action="{% url "users:logout" %}" method="post">
        {% csrf_token %}
        <button class="btn btn-outline-info" type="submit">Выйти</button>
        </form>
        {% else %}
        <a href="{% url "users:register" %}" class="btn btn-outline-info me-2">Зарегистрироваться</a>
        <a href="{% url "users:login" %}" class="btn btn-outline-info">Войти</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer class="py-3 my-4">
    <p class="text-center text-muted">Учебный Django-проект</p>
</footer>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/script-my.js' %}"></script>
<script src="{% static 'js/theme-toggle.js' %}"></script>

</body>
</html>
